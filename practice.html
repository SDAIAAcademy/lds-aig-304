<section>
<h2>اليوم 1: منطق نظام الإدارة ونطاقه</h2>
<ol>
<li><p>شركة افتراضية لتأجير المعدات الثقيلة حصلت على شهادة نظام إدارة الذكاء الاصطناعي، ونطاقها «نموذج التنبؤ بأعطال الرافعات». تريد الشركة أن تكتب في عرضها لعميل أن «كل أنظمة الذكاء الاصطناعي لدينا معتمدة». ما الرد الأدق؟</p><ul><li><b>أ.</b> الشهادة تثبت أن نموذج الأعطال دقيق ومنصف</li><li><b>ب.</b> الشهادة تغطي نظام الإدارة في نطاق نموذج الأعطال وحده</li><li><b>ج.</b> العبارة صحيحة ما دامت الشهادة صادرة باسم الشركة كلها</li><li><b>د.</b> الشهادة تثبت أن الشركة تفي بكل أنظمة حماية البيانات</li></ul></li>
<li><p>شركة تأجير المعدات تشتري خدمة لتصنيف رسائل العملاء. قرر فريقها أن يعيد تدريب النموذج كل شهر على رسائلها هي، ثم يستعمله في توزيع الرسائل. ما دورها في النسخة المعدّلة؟</p><ul><li><b>أ.</b> مستخدم فقط</li><li><b>ب.</b> مقدم خدمة ومستخدم</li><li><b>ج.</b> مطوّر ومستخدم</li><li><b>د.</b> لا دور لها</li></ul></li>
<li><p>في مسودة نطاق شركة تأجير المعدات أربعة استثناءات. أيها مبرر؟</p><ul><li><b>أ.</b> نموذج أسعار التأجير: لم تصل منه شكوى بعد</li><li><b>ب.</b> مساعد العملاء: يتولاه قسم تقنية المعلومات</li><li><b>ج.</b> نموذج جدولة الصيانة: سيُستبدل العام القادم</li><li><b>د.</b> إشارات المرور قرب المستودع: تشغلها البلدية</li></ul></li>
<li><p>هذه أربعة أسطر من مسودة سياسة شركة تأجير المعدات. أيها ينتقل إلى إجراء؟</p><ul><li><b>أ.</b> تلتزم الشركة بالتحسين المستمر لنظام إدارة الذكاء الاصطناعي في كل فروعها</li><li><b>ب.</b> يعيد فريق البيانات اختبار نموذج الأعطال كل أسبوعين، ويوقفه فوق خطأ 8%</li><li><b>ج.</b> لا يُتخذ قرار يمس عاملًا أو عميلًا بنتيجة آلية دون مراجعة بشرية</li><li><b>د.</b> تضع الشركة كل عام أهدافًا قابلة للقياس للذكاء الاصطناعي، وتراجعها الإدارة</li></ul></li>
<li><p>في شركة لتأجير المعدات الثقيلة، يسأل فريق: ماذا يصيب العملاء وعمال المواقع إذا أخطأ نظام تسعير التأجير الآلي؟ أي نشاط يجريه الفريق؟</p><ul><li><b>أ.</b> تقييم أثر النظام على الأفراد والمجتمع</li><li><b>ب.</b> تدقيق داخلي على عينة من عقود التأجير</li><li><b>ج.</b> مراجعة الإدارة لنتائج أداء نظام الإدارة</li><li><b>د.</b> تقييم مخاطر أمن المعلومات في الخوادم</li></ul></li>
<li><p>شركة تأمين تعرض شهادة مطابقة لمعيار نظام إدارة الذكاء الاصطناعي صادرة عن جهة منح معتمدة. ماذا تثبت الشهادة؟</p><ul><li><b>أ.</b> أن كل نظام ذكاء اصطناعي تشغّله الشركة آمن ودقيق في نتائجه</li><li><b>ب.</b> أن نظام الإدارة داخل نطاقها طابق المعيار عند التدقيق</li><li><b>ج.</b> أن الشركة ملتزمة بكل الأنظمة الوطنية النافذة في مجالها</li><li><b>د.</b> أن منتجات الشركة حاصلة على اعتماد مقدمي الخدمات من سدايا</li></ul></li>
<li><p>ورود كلمة «الخطر» في بند من بنود المعيار يعني أن البند يطلب من الجهة إجراء تقييم للمخاطر.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في شركة تأمين، يعاين فريق عينة من سجلات المطالبات ليعرف هل طُبّق إجراء مراجعة قرارات النموذج كما كُتب. في أي مرحلة من دورة التخطيط والتنفيذ والتحقق والتصحيح يقع هذا العمل؟</p><ul><li><b>أ.</b> التخطيط</li><li><b>ب.</b> التنفيذ</li><li><b>ج.</b> التحقق</li><li><b>د.</b> التصحيح</li></ul></li>
<li><p>شركة تأمين تشتري خدمة جاهزة تقدّر الأضرار من صور السيارات، ويستعملها موظفوها في قرارات التعويض. ما دور الشركة في هذا النظام؟</p><ul><li><b>أ.</b> مقدم الخدمة</li><li><b>ب.</b> المطوِّر</li><li><b>ج.</b> لا دور لها</li><li><b>د.</b> المستخدم</li></ul></li>
<li><p>مسودة نطاق في شركة لتأجير المعدات تستثني نموذجًا يقدّر قيمة المعدات المستعملة عند شرائها، والسبب المكتوب «لم تصل منه شكوى». النموذج يحدد اليوم السعر الذي تعرضه الشركة على البائعين. ما الحكم على الاستثناء؟</p><ul><li><b>أ.</b> يقوم</li><li><b>ب.</b> لا يقوم</li><li><b>ج.</b> يقوم إذا وقّعه المدير العام</li><li><b>د.</b> يقوم حتى تصل أول شكوى</li></ul></li>
<li><p>تراجع شركة لتأجير المعدات مسودة سياستها للذكاء الاصطناعي، وفيها أربعة أسطر. أي سطر مكانه السياسة التي تعتمدها الإدارة العليا؟</p><ul><li><b>أ.</b> يُعاد تدريب نموذج التسعير كل 90 يومًا</li><li><b>ب.</b> تُراجع دقة النموذج إذا نزلت عن 85%</li><li><b>ج.</b> يُرفع كل حادث إلى مكتب الحوكمة خلال 48 ساعة</li><li><b>د.</b> تلتزم الشركة بمراجعة بشرية للقرارات الآلية</li></ul></li>
<li><p>قد يجتمع لجهة واحدة دوران في نظام ذكاء اصطناعي واحد، كأن تكون مطوِّره ومستخدمه.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الأهداف والضوابط وبيان قابلية التطبيق</h2>
<ol>
<li><p>مسودة نطاق في شركة لتأجير المعدات الثقيلة تستثني جدول حساب أجرة التأجير، وهو معادلات ثابتة كتبها محلل مالي. ما الحكم؟</p><ul><li><b>أ.</b> يقوم الاستثناء كما هو</li><li><b>ب.</b> لا يقوم الاستثناء</li><li><b>ج.</b> يقوم بعد توقيع المدير</li></ul></li>
<li><p>أربعة أهداف كتبتها إدارات شركة تأجير المعدات. أيها لا يحتاج تعديلًا؟</p><ul><li><b>أ.</b> نسبة عقود التأجير المراجعة قانونيًا قبل توقيعها 100% في كل الفروع</li><li><b>ب.</b> رفع جودة نماذج الذكاء الاصطناعي وثقة العملاء بها في كل الفروع</li><li><b>ج.</b> صفر أعطال غير متوقعة في الرافعات في 2027؛ المالك مدير الصيانة</li><li><b>د.</b> نسبة الرافعات ذات الفحص الشهري الموثق 95% في 2027؛ المالك مدير الصيانة</li></ul></li>
<li><p>أربعة أسطر مستبعدة في بيان شركة تأجير المعدات. أي مبرر يقنع مدققًا؟</p><ul><li><b>أ.</b> ضابط قناة الإبلاغ عن المخاوف: الموظفون قليلون</li><li><b>ب.</b> ضابط المراقبة: كلفته عالية في ميزانية هذا العام</li><li><b>ج.</b> ضابط بيانات التدريب: الشركة لا تدرّب أي نموذج</li><li><b>د.</b> ضابط الموردين: المورّد مسؤول عن خدمته في العقد</li></ul></li>
<li><p>شركة تأجير المعدات تشتري خدمة تلخص تقارير الحوادث في المواقع، وفي التقارير أسماء العمال. أي شرط في العقد يحتاج تعديلًا قبل التجديد؟</p><ul><li><b>أ.</b> يجوز للمورّد نقل المعالجة إلى مقاول من الباطن دون إشعار</li><li><b>ب.</b> يشعر المورّد الشركة بتغيير النموذج قبل ثلاثين يومًا</li><li><b>ج.</b> يحفظ المورّد سجلات الطلبات تسعين يومًا لتتبع الأخطاء</li><li><b>د.</b> يعالج المورّد البيانات ويحفظها داخل المملكة فقط</li></ul></li>
<li><p>في مقابلة كتالوج شركة تأجير المعدات بإطار NIST، فئة تطلب عمليات «تحدد مستوى أنشطة إدارة المخاطر اللازم بحسب تقبّل الجهة للمخاطر» لا يقابلها ضابط. ما القرار الأدق؟</p><ul><li><b>أ.</b> تُبلَّغ NIST بأن الفئة لا تنطبق على الشركة</li><li><b>ب.</b> تُكتب مغطاة ببند المخاطر في نظام الإدارة</li><li><b>ج.</b> يُضاف ضابط جديد بالعنوان نفسه إلى الكتالوج</li><li><b>د.</b> تُحذف الفئة من جدول المقابلة كله</li></ul></li>
<li><p>أي هدف من أهداف نظام إدارة الذكاء الاصطناعي في مصنع للأغذية قابل للقياس؟</p><ul><li><b>أ.</b> إجراء تقييم أثر لكل نظام جديد قبل إطلاقه بنسبة 100% في 2027، ومسؤولته مديرة الجودة</li><li><b>ب.</b> تحسين ثقة المستهلكين في أنظمة الذكاء الاصطناعي التي يستعملها المصنع في 2027، بإشراف مديرة الجودة</li><li><b>ج.</b> الالتزام بأعلى معايير أخلاقيات الذكاء الاصطناعي في كل أنظمة المصنع وخطوط إنتاجه</li><li><b>د.</b> تعزيز ثقافة الاستعمال المسؤول بين الموظفين في كل الإدارات خلال العام القادم</li></ul></li>
<li><p>مصفوفة الكفاءة في شركة تأمين تبيّن أن فريق المطالبات لم يتدرب على مراجعة مخرجات نظام تقدير الأضرار. ما الإجراء المناسب في نظام الإدارة؟</p><ul><li><b>أ.</b> إخراج النظام من النطاق حتى يتدرب الفريق</li><li><b>ب.</b> تكليف مدقق خارجي بمرافقة الفريق</li><li><b>ج.</b> تدريب الفريق والاحتفاظ بسجل يثبت الكفاءة</li><li><b>د.</b> إضافة سطر عن التدريب إلى السياسة</li></ul></li>
<li><p>في سجل مخاطر مصنع للأغذية، خطر «انحياز نظام فحص الجودة ضد مورد صغير» قُدّر باحتمالية 4 وأثر 3 على مصفوفة الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي. ما مستواه؟</p><ul><li><b>أ.</b> منخفض</li><li><b>ب.</b> متوسط</li><li><b>ج.</b> مرتفع</li><li><b>د.</b> كارثي</li></ul></li>
<li><p>في سجل مخاطر مصنع للأغذية، خطر «نظام فحص الجودة يمرر عبوات ملوثة» قُدّر باحتمالية 4 وأثر 4 على مصفوفة الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي. ما تسمية مستواه؟</p><ul><li><b>أ.</b> مرتفع</li><li><b>ب.</b> كارثي</li><li><b>ج.</b> حرج</li><li><b>د.</b> جسيم</li></ul></li>
<li><p>في بيان قابلية التطبيق لشركة لتأجير المعدات، ضابط معلومات النظام للمستخدمين مكتوب «مستبعد: العملاء لا يقرؤون الشروط»، وفي سجل المخاطر خطر أن يفهم العملاء السعر الآلي خطأً فيدفعوا أكثر. ما الحكم على هذا السطر؟</p><ul><li><b>أ.</b> الاستبعاد لا يقوم</li><li><b>ب.</b> الاستبعاد يقوم</li><li><b>ج.</b> يقوم إذا اعتمدته الإدارة العليا</li><li><b>د.</b> يكفي تغيير الحالة إلى «مخطط»</li></ul></li>
<li><p>شركة تأمين تشتري خدمة ترجمة آلية لمراسلات العملاء، وفي مسودة العقد حق للمورّد في نقل المعالجة إلى مقاول من الباطن دون إشعار الشركة. أين تعالج الشركة هذا الشرط؟</p><ul><li><b>أ.</b> لا تعالجه الشركة</li><li><b>ب.</b> في سياسة الذكاء الاصطناعي وحدها</li><li><b>ج.</b> في تقرير التدقيق الخارجي القادم</li><li><b>د.</b> في تقييم المورّد وسجل المخاطر قبل توقيع العقد</li></ul></li>
<li><p>وفق مبادئ سدايا للذكاء الاصطناعي التوليدي للجهات الحكومية، يجوز للموظف إدخال بيانات مصنفة «مقيدة» في أداة توليدية إذا حذف منها الأسماء.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>عند مقابلة ضوابط جهة بالفئات الفرعية في إطار NIST لإدارة مخاطر الذكاء الاصطناعي، ماذا تعني فئة فرعية لا يقابلها أي ضابط؟</p><ul><li><b>أ.</b> فجوة محتملة يُقرَّر فيها ضابط أو استبعاد</li><li><b>ب.</b> خطأ في الإطار يُبلغ عنه ناشره ليصححه</li><li><b>ج.</b> أن الجهة مطابقة لإطار NIST في هذه الفئة</li><li><b>د.</b> أن الفئة لا تنطبق على أي جهة خاصة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: التدقيق الداخلي والتحسين</h2>
<ol>
<li><p>في بيان شركة تأجير المعدات، ضابط المراقبة مُدرج، والدليل: «مراقبة شهرية لنموذج الأعطال، ولا مراقبة لنموذج التسعير». ما الحالة؟</p><ul><li><b>أ.</b> منفذ</li><li><b>ب.</b> مخطط</li><li><b>ج.</b> منفذ جزئيًا</li><li><b>د.</b> مستبعد</li></ul></li>
<li><p>تريد شركة تأجير المعدات أن تدقق ضابط مراقبة نموذج الأعطال، ومالكه إدارة الصيانة. من يصح أن يدققه؟</p><ul><li><b>أ.</b> مدير الصيانة نفسه</li><li><b>ب.</b> مهندس صيانة معار إلى التدقيق</li><li><b>ج.</b> الفني الذي كتب قائمة المراقبة</li><li><b>د.</b> مدقق داخلي من فريق التدقيق</li></ul></li>
<li><p>تدقق إجراء فحص الرافعات في شركة تأجير المعدات. أي ما يلي دليل موضوعي على أن الفحص يجري؟</p><ul><li><b>أ.</b> قول مدير الصيانة إن الفحص لا يتأخر أبدًا</li><li><b>ب.</b> سجل فحص شهري موقّع ومؤرخ لعشر رافعات</li><li><b>ج.</b> إجراء الفحص المعتمد وفيه المهلة الشهرية</li><li><b>د.</b> استبيان يقول إن الفنيين راضون عن الإجراء</li></ul></li>
<li><p>في شركة تأجير المعدات، إجراء مراجعة الإدارة يطلب اجتماعًا كل ستة أشهر يراجع نتائج نظام إدارة الذكاء الاصطناعي. آخر اجتماع عُقد قبل ثمانية عشر شهرًا، ولا موعد للقادم. ما الدرجة بقاعدة المقرر؟</p><ul><li><b>أ.</b> طفيفة</li><li><b>ب.</b> جسيمة</li><li><b>ج.</b> ملاحظة</li><li><b>د.</b> لا ملاحظة</li></ul></li>
<li><p>إجراء تصحيحي في شركة تأجير المعدات: تذكير آلي بموعد فحص كل رافعة. أي مقياس نجاح يثبت فعاليته؟</p><ul><li><b>أ.</b> تشغيل التذكير الآلي لكل الرافعات قبل نهاية الشهر</li><li><b>ب.</b> حضور كل الفنيين جلسة توعية عن الإجراء الجديد</li><li><b>ج.</b> 95% من الفحوص في موعدها، كل شهر لثلاثة أشهر</li><li><b>د.</b> رضا مدير الصيانة والفنيين عن التذكير الجديد</li></ul></li>
<li><p>تعدّ رئيسة التدقيق الداخلي في شركة لتأجير المعدات برنامجًا، وفيه تدقيق إجراء صيانة الآلات. أي مدقق يخالف قاعدة الاستقلالية إذا دقق هذا الإجراء؟</p><ul><li><b>أ.</b> مدقق من الشؤون المالية في الشركة</li><li><b>ب.</b> مشرف الصيانة الذي كتب الإجراء</li><li><b>ج.</b> مدققة من إدارة الجودة والسلامة</li><li><b>د.</b> مدقق خارجي متعاقد مع الشركة</li></ul></li>
<li><p>تعدّ مدققة برنامج تدقيق قائمًا على المخاطر لدورة واحدة في شركة تأمين. أي منطقة تأخذ أكبر وقت وأقرب موعد؟</p><ul><li><b>أ.</b> أقدم الإجراءات المكتوبة في الشركة</li><li><b>ب.</b> الوظائف الأقل عددًا في الموظفين</li><li><b>ج.</b> ما دُقق في الدورة الماضية دون ملاحظات</li><li><b>د.</b> الضوابط المرتبطة بأخطار مرتفعة وبنظام تغيّر حديثًا</li></ul></li>
<li><p>برنامج التدقيق الداخلي القائم على المخاطر يغطي خلال الدورة كل بنود المعيار، ولا يقتصر على الضوابط عالية المخاطر.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مدققة في مصنع للأغذية تعدّ خطة لتدقيق واحد على إجراء فحص الجودة الآلي الأسبوع القادم. ماذا تكتب في الخطة قبل أن تبدأ؟</p><ul><li><b>أ.</b> الهدف والنطاق والمعايير والمدققين والمواعيد</li><li><b>ب.</b> الملاحظات المتوقعة ودرجة كل منها</li><li><b>ج.</b> أسماء من يُحاسَبون على الأخطاء المكتشفة</li><li><b>د.</b> الإجراءات التصحيحية المطلوبة من كل إدارة مدقَّقة</li></ul></li>
<li><p>مدقق في مصنع للأغذية يريد ثقة 95% أن نسبة الأخطاء في سجل كبير أقل من 20%، إذا لم يجد أي خطأ في العينة. ما أصغر عينة تكفي؟</p><ul><li><b>أ.</b> 5</li><li><b>ب.</b> 14</li><li><b>ج.</b> 29</li><li><b>د.</b> 59</li></ul></li>
<li><p>في مصنع للأغذية، الإجراء يطلب توقيع مشرف الجودة على كل تقرير معايرة لموازين خط التعبئة. التقارير الثلاثون لهذا الربع كلها موقعة في موعدها، لكن النموذج لا يطلب رقم الميزان، فيصعب ربط التقرير بالجهاز حين تُبدَّل الموازين بين الخطوط. ما درجة ما وجده المدقق وفق قاعدة المقرر؟</p><ul><li><b>أ.</b> جسيمة</li><li><b>ب.</b> طفيفة</li><li><b>ج.</b> ملاحظة</li><li><b>د.</b> لا ملاحظة</li></ul></li>
<li><p>قال مدير في مقابلة تدقيق إن كل الفريق تدرب على الأداة الجديدة. ماذا يفعل المدقق؟</p><ul><li><b>أ.</b> يسجّل القول دليلًا كافيًا في التقرير</li><li><b>ب.</b> يطلب سجلات التدريب ويعاين عينة منها</li><li><b>ج.</b> يكتب ملاحظة جسيمة في الحال</li><li><b>د.</b> يحيل السؤال إلى المدقق الخارجي ليتحقق</li></ul></li>
<li><p>الملاحظة في تقرير التدقيق الداخلي تذكر المتطلب والدليل والدرجة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في مصنع للأغذية، طبع نظام آلي ملصقات حساسية خاطئة ثلاث مرات هذا العام، كل مرة بعد تحديث قائمة المكونات. أي عبارة سبب جذري، لا عرَض ولا لوم؟</p><ul><li><b>أ.</b> لا تحقق من الملصق بعد تحديث القائمة</li><li><b>ب.</b> أخطأ مشغل الطابعة في مراجعة الملصقات</li><li><b>ج.</b> كانت تحديثات القائمة كثيرة هذا العام</li><li><b>د.</b> طُبعت ملصقات خاطئة ثلاث مرات</li></ul></li>
<li><p>بعد ملصقات الحساسية الخاطئة في مصنع الأغذية، أي إجراء تصحيحي مكتوب كما ينبغي؟</p><ul><li><b>أ.</b> تدريب كل المشغلين مرة أخرى على مراجعة الملصقات قبل نهاية الشهر</li><li><b>ب.</b> رسالة شهرية من مدير الجودة تذكّر المشغلين بأهمية الدقة في الملصقات</li><li><b>ج.</b> خطوة تحقق بعد كل تحديث يملكها مدير الجودة، ويعاين مدقق داخلي عينة شهرية لثلاثة أشهر بلا خطأ</li><li><b>د.</b> إضافة خطوة تحقق إلى الإجراء، ثم إغلاق الملاحظة في اليوم نفسه</li></ul></li>
<li><p>يجوز أن يتحقق مالك الإجراء التصحيحي بنفسه من فعاليته ويغلقه.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في تدقيق متابعة بمصنع الأغذية، 45 من 50 فحصًا للملصقات أُجري في موعده، ومقياس النجاح المكتوب 98%. ما قرار تدقيق المتابعة؟</p><ul><li><b>أ.</b> يُغلق الإجراء</li><li><b>ب.</b> يُغلق إذا وافق مالكه</li><li><b>ج.</b> يُخفض المقياس ثم يُغلق</li><li><b>د.</b> يبقى مفتوحًا</li></ul></li>
</ol>

isconceptions":["الكلمة وحدها لا تكفي: المهم هل يطلب البند إجراء التقييم.",""],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d1-04","type":"single","prompt":"في شركة تأمين، يعاين فريق عينة من سجلات المطالبات ليعرف هل طُبّق إجراء مراجعة قرارات النموذج كما كُتب. في أي مرحلة من دورة التخطيط والتنفيذ والتحقق والتصحيح يقع هذا العمل؟","options":[{"key":"أ","text":"التخطيط"},{"key":"ب","text":"التنفيذ"},{"key":"ج","text":"التحقق"},{"key":"د","text":"التصحيح"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"معاينة السجلات للتحقق من تطبيق إجراء تدقيق، والتدقيق جزء من تقييم الأداء، أي مرحلة التحقق.","misconceptions":["التخطيط يضع الأهداف والضوابط قبل أن يوجد ما يُعاين.","التنفيذ تشغيل الإجراء نفسه، لا فحصه.","","التصحيح يعالج ما كشفه التحقق، ولا يكشفه."],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d1-05","type":"single","prompt":"شركة تأمين تشتري خدمة جاهزة تقدّر الأضرار من صور السيارات، ويستعملها موظفوها في قرارات التعويض. ما دور الشركة في هذا النظام؟","options":[{"key":"أ","text":"مقدم الخدمة"},{"key":"ب","text":"المطوِّر"},{"key":"ج","text":"لا دور لها"},{"key":"د","text":"المستخدم"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الشركة تستعمل النظام في عملها ولم تبنه ولا تتيحه لغيرها، فهي مستخدم؛ وكون المورّد بناه لا يُسقط دورها.","misconceptions":["يظن أن إبلاغ العميل بقرار التعويض يعني أن الشركة تتيح النظام نفسه لغيرها.","يظن أن ضبط الإعدادات المتاحة بناء أو تغيير جوهري للنظام.","يظن أن من لم يبن النظام لا دور له، ومن يستعمله في قرار يمس الناس له دور.",""],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-06","type":"single","prompt":"مسودة نطاق في شركة لتأجير المعدات تستثني نموذجًا يقدّر قيمة المعدات المستعملة عند شرائها، والسبب المكتوب «لم تصل منه شكوى». النموذج يحدد اليوم السعر الذي تعرضه الشركة على البائعين. ما الحكم على الاستثناء؟","options":[{"key":"أ","text":"يقوم"},{"key":"ب","text":"لا يقوم"},{"key":"ج","text":"يقوم إذا وقّعه المدير العام"},{"key":"د","text":"يقوم حتى تصل أول شكوى"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الاستثناء يقوم إذا لم يكن النظام ذكاءً اصطناعيًا أو لم يكن للجهة دور فيه؛ نموذج يحدد أسعارًا اليوم يحتاج ضوابطها، وغياب الشكوى لا يعني غياب الأثر.","misconceptions":["يعدّ غياب الشكوى دليلًا على غياب الأثر.","","يظن أن التوقيع يصنع مبررًا ليس موجودًا.","يجعل الشكوى شرطًا لدخول النطاق، والنطاق يُقرر بالدور والأثر."],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d1-07","type":"single","prompt":"تراجع شركة لتأجير المعدات مسودة سياستها للذكاء الاصطناعي، وفيها أربعة أسطر. أي سطر مكانه السياسة التي تعتمدها الإدارة العليا؟","options":[{"key":"أ","text":"يُعاد تدريب نموذج التسعير كل 90 يومًا"},{"key":"ب","text":"تُراجع دقة النموذج إذا نزلت عن 85%"},{"key":"ج","text":"يُرفع كل حادث إلى مكتب الحوكمة خلال 48 ساعة"},{"key":"د","text":"تلتزم الشركة بمراجعة بشرية للقرارات الآلية"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"السياسة تذكر الالتزام والاتجاه؛ الأرقام والعتبات والمهل تتغير فمكانها إجراء.","misconceptions":["دورة إعادة التدريب تفصيل تشغيلي يتغير، فمكانه إجراء.","العتبة رقم يتغير، فمكانها إجراء المراقبة.","المهلة تفصيل لإجراء الحوادث.",""],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-01","type":"single","prompt":"أي هدف من أهداف نظام إدارة الذكاء الاصطناعي في مصنع للأغذية قابل للقياس؟","options":[{"key":"أ","text":"إجراء تقييم أثر لكل نظام جديد قبل إطلاقه بنسبة 100% في 2027، ومسؤولته مديرة الجودة"},{"key":"ب","text":"تحسين ثقة المستهلكين في أنظمة الذكاء الاصطناعي التي يستعملها المصنع في 2027، بإشراف مديرة الجودة"},{"key":"ج","text":"الالتزام بأعلى معايير أخلاقيات الذكاء الاصطناعي في كل أنظمة المصنع وخطوط إنتاجه"},{"key":"د","text":"تعزيز ثقافة الاستعمال المسؤول بين الموظفين في كل الإدارات خلال العام القادم"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الهدف القابل للقياس يذكر ما يُقاس وقيمته وموعده ومن يملكه؛ الخيارات الأخرى نوايا لا تُقاس.","misconceptions":["","فيه موعد ومسؤولة، لكن لا مقياس ولا قيمة مستهدفة يُحكم بها.","«أعلى المعايير» لا يمكن التحقق منه.","فيه مدة، لكنه عبارة عامة بلا مقياس ولا قيمة مستهدفة ولا مسؤول."],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d1-08","type":"tf","prompt":"قد يجتمع لجهة واحدة دوران في نظام ذكاء اصطناعي واحد، كأن تكون مطوِّره ومستخدمه.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الدور يتبع ما تفعله الجهة بالنظام؛ جهة تبني نظامًا وتستعمله في عملها مطوِّر ومستخدم معًا.","misconceptions":["","الأدوار ليست حصرية؛ تُكتب كلها في السجل."],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d2-02","type":"single","prompt":"مصفوفة الكفاءة في شركة تأمين تبيّن أن فريق المطالبات لم يتدرب على مراجعة مخرجات نظام تقدير الأضرار. ما الإجراء المناسب في نظام الإدارة؟","options":[{"key":"أ","text":"إخراج النظام من النطاق حتى يتدرب الفريق"},{"key":"ب","text":"تكليف مدقق خارجي بمرافقة الفريق"},{"key":"ج","text":"تدريب الفريق والاحتفاظ بسجل يثبت الكفاءة"},{"key":"د","text":"إضافة سطر عن التدريب إلى السياسة"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"الكفاءة تُسد فجوتها بإجراء كالتدريب، ويُحتفظ بدليل موثق على اكتسابها.","misconceptions":["النظام يعمل ويمس الناس؛ إخراجه يخفي الفجوة ولا يسدها.","المدقق يفحص ولا يُكسب الفريق كفاءة.","","سطر في السياسة لا يدرّب أحدًا ولا يثبت الكفاءة."],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-03","type":"single","prompt":"في سجل مخاطر مصنع للأغذية، خطر «انحياز نظام فحص الجودة ضد مورد صغير» قُدّر باحتمالية 4 وأثر 3 على مصفوفة الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي. ما مستواه؟","options":[{"key":"أ","text":"منخفض"},{"key":"ب","text":"متوسط"},{"key":"ج","text":"مرتفع"},{"key":"د","text":"كارثي"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"الحاصل 4 × 3 = 12، ويقع في نطاق المستوى المرتفع (من 8 إلى 12).","misconceptions":["المنخفض للحاصل 1 أو 2.","المتوسط من 3 إلى 6.","","الكارثي للحاصل 16 وحده."],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-04","type":"single","prompt":"في سجل مخاطر مصنع للأغذية، خطر «نظام فحص الجودة يمرر عبوات ملوثة» قُدّر باحتمالية 4 وأثر 4 على مصفوفة الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي. ما تسمية مستواه؟","options":[{"key":"أ","text":"مرتفع"},{"key":"ب","text":"كارثي"},{"key":"ج","text":"حرج"},{"key":"د","text":"جسيم"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الحاصل 16، والإطار الوطني يسمي المستوى 16 «كارثي»، وهو أعلى المستويات.","misconceptions":["المرتفع للحاصل من 8 إلى 12.","","«حرج» ليس من تسميات الإطار.","«جسيم» درجة لملاحظة التدقيق في قاعدة المقرر، لا مستوى خطر."],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"remember","pool":"practice"},{"id":"q-d2-05","type":"single","prompt":"في بيان قابلية التطبيق لشركة لتأجير المعدات، ضابط معلومات النظام للمستخدمين مكتوب «مستبعد: العملاء لا يقرؤون الشروط»، وفي سجل المخاطر خطر أن يفهم العملاء السعر الآلي خطأً فيدفعوا أكثر. ما الحكم على هذا السطر؟","options":[{"key":"أ","text":"الاستبعاد لا يقوم"},{"key":"ب","text":"الاستبعاد يقوم"},{"key":"ج","text":"يقوم إذا اعتمدته الإدارة العليا"},{"key":"د","text":"يكفي تغيير الحالة إلى «مخطط»"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"مبرر كل ضابط في البيان يأتي من تقييم المخاطر؛ والسجل يبيّن خطرًا يعالجه هذا الضابط، فلا يقوم استبعاده.","misconceptions":["","يقبل سببًا مكتوبًا دون مقابلته بالسجل.","يظن أن الاعتماد يصحح مبررًا يناقضه السجل.","يخلط بين الحالة والقرار: الحالة لا تصلح استبعادًا خاطئًا."],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d2-06","type":"single","prompt":"شركة تأمين تشتري خدمة ترجمة آلية لمراسلات العملاء، وفي مسودة العقد حق للمورّد في نقل المعالجة إلى مقاول من الباطن دون إشعار الشركة. أين تعالج الشركة هذا الشرط؟","options":[{"key":"أ","text":"لا تعالجه الشركة"},{"key":"ب","text":"في سياسة الذكاء الاصطناعي وحدها"},{"key":"ج","text":"في تقرير التدقيق الخارجي القادم"},{"key":"د","text":"في تقييم المورّد وسجل المخاطر قبل توقيع العقد"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الخدمة المشتراة داخل نطاق الجهة المستخدمة؛ يُقيَّم الشرط في تقييم المورّد، ويُسجل خطره، ويُعدَّل العقد قبل توقيعه.","misconceptions":["يظن أن مسؤولية المورّد تنقل مسؤولية الجهة عن بيانات عملائها.","يظن أن السياسة تعالج شرطًا في عقد بعينه، وهي تذكر الالتزام فقط.","يظن أن التدقيق الخارجي يعالج، وهو يكشف فقط.",""],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-07","type":"tf","prompt":"وفق مبادئ سدايا للذكاء الاصطناعي التوليدي للجهات الحكومية، يجوز للموظف إدخال بيانات مصنفة «مقيدة» في أداة توليدية إذا حذف منها الأسماء.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المبادئ تنص على عدم إدخال أي بيانات تُصنَّف على مستوى مقيد فأعلى، وتقصر الاستعمال على البيانات العامة؛ حذف الأسماء لا يغيّر التصنيف.","misconceptions":["التصنيف للبيانات كلها، وحذف الأسماء لا يجعلها عامة.",""],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"remember","pool":"practice"},{"id":"q-d2-08","type":"single","prompt":"عند مقابلة ضوابط جهة بالفئات الفرعية في إطار NIST لإدارة مخاطر الذكاء الاصطناعي، ماذا تعني فئة فرعية لا يقابلها أي ضابط؟","options":[{"key":"أ","text":"فجوة محتملة يُقرَّر فيها ضابط أو استبعاد"},{"key":"ب","text":"خطأ في الإطار يُبلغ عنه ناشره ليصححه"},{"key":"ج","text":"أن الجهة مطابقة لإطار NIST في هذه الفئة"},{"key":"د","text":"أن الفئة لا تنطبق على أي جهة خاصة"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الفئة غير المقابَلة تكشف ما قد ينقص كتالوج الجهة، فيُقرر لها ضابط أو استبعاد له سبب.","misconceptions":["","الإطاران مختلفان في البناء، وعدم التقابل ليس خطأ.","غياب المقابل يدل على فجوة، لا على مطابقة.","الانطباق يُقرر لكل جهة على ضوء مخاطرها."],"lo":["LO3","LO1"],"day":2,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-01","type":"single","prompt":"تعدّ رئيسة التدقيق الداخلي في شركة لتأجير المعدات برنامجًا، وفيه تدقيق إجراء صيانة الآلات. أي مدقق يخالف قاعدة الاستقلالية إذا دقق هذا الإجراء؟","options":[{"key":"أ","text":"مدقق من الشؤون المالية في الشركة"},{"key":"ب","text":"مشرف الصيانة الذي كتب الإجراء"},{"key":"ج","text":"مدققة من إدارة الجودة والسلامة"},{"key":"د","text":"مدقق خارجي متعاقد مع الشركة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المدقق لا يدقق عمله؛ من كتب الإجراء ويشرف عليه لا يملك الموضوعية لتدقيقه.","misconceptions":["يظن أن المدقق من إدارة أخرى غير مستقل، وهو لا صلة له بالصيانة.","","يظن أن الجودة تتبع الصيانة، وهي مستقلة عنها.","يظن أن المتعاقد الخارجي لا يصلح، وهو مستقل ما دام لم يكتب الإجراء."],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-02","type":"single","prompt":"تعدّ مدققة برنامج تدقيق قائمًا على المخاطر لدورة واحدة في شركة تأمين. أي منطقة تأخذ أكبر وقت وأقرب موعد؟","options":[{"key":"أ","text":"أقدم الإجراءات المكتوبة في الشركة"},{"key":"ب","text":"الوظائف الأقل عددًا في الموظفين"},{"key":"ج","text":"ما دُقق في الدورة الماضية دون ملاحظات"},{"key":"د","text":"الضوابط المرتبطة بأخطار مرتفعة وبنظام تغيّر حديثًا"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"البرنامج القائم على المخاطر يضع الوقت حيث الخطر المرتفع والتغيير الحديث.","misconceptions":["قدم الإجراء لا يدل على خطره.","عدد الموظفين لا يقيس الخطر.","غياب الملاحظات السابقة يقلل الأولوية لا يرفعها.",""],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-03","type":"tf","prompt":"برنامج التدقيق الداخلي القائم على المخاطر يغطي خلال الدورة كل بنود المعيار، ولا يقتصر على الضوابط عالية المخاطر.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"المخاطر ترتب العمق والموعد، لكن البرنامج يغطي نظام الإدارة كله في الدورة.","misconceptions":["","الاقتصار على الضوابط العالية يترك بنود نظام الإدارة بلا تدقيق."],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-04","type":"single","prompt":"مدققة في مصنع للأغذية تعدّ خطة لتدقيق واحد على إجراء فحص الجودة الآلي الأسبوع القادم. ماذا تكتب في الخطة قبل أن تبدأ؟","options":[{"key":"أ","text":"الهدف والنطاق والمعايير والمدققين والمواعيد"},{"key":"ب","text":"الملاحظات المتوقعة ودرجة كل منها"},{"key":"ج","text":"أسماء من يُحاسَبون على الأخطاء المكتشفة"},{"key":"د","text":"الإجراءات التصحيحية المطلوبة من كل إدارة مدقَّقة"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الخطة تُعد قبل التدقيق: ما الهدف، وما النطاق، وبأي معايير، ومن يدقق، ومتى.","misconceptions":["","يكتب النتيجة قبل الدليل، والملاحظات تأتي من المعاينة.","يظن أن التدقيق يبحث عمّن يُحاسَب، وهو يعاين المطابقة.","يخلط بين دور المدقق ودور المدقَّق: الإجراءات يعدّها المدقَّق بعد التقرير."],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"remember","pool":"practice"},{"id":"q-d3-05","type":"single","prompt":"مدقق في مصنع للأغذية يريد ثقة 95% أن نسبة الأخطاء في سجل كبير أقل من 20%، إذا لم يجد أي خطأ في العينة. ما أصغر عينة تكفي؟","options":[{"key":"أ","text":"5"},{"key":"ب","text":"14"},{"key":"ج","text":"29"},{"key":"د","text":"59"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"أصغر n يحقق 0.8^n ≤ 0.05 هو 14 (0.8^13 ≈ 0.055 و0.8^14 ≈ 0.044)؛ و29 لنسبة 10%، و59 لنسبة 5%.","misconceptions":["5 سجلات تترك احتمالًا نحو 33% ألا يظهر خطأ موجود.","","29 لنسبة 10%، وهي أكبر من الحاجة هنا.","59 لنسبة 5%، وهي أكبر بكثير من الحاجة."],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-06","type":"single","prompt":"في مصنع للأغذية، الإجراء يطلب توقيع مشرف الجودة على كل تقرير معايرة لموازين خط التعبئة. التقارير الثلاثون لهذا الربع كلها موقعة في موعدها، لكن النموذج لا يطلب رقم الميزان، فيصعب ربط التقرير بالجهاز حين تُبدَّل الموازين بين الخطوط. ما درجة ما وجده المدقق وفق قاعدة المقرر؟","options":[{"key":"أ","text":"جسيمة"},{"key":"ب","text":"طفيفة"},{"key":"ج","text":"ملاحظة"},{"key":"د","text":"لا ملاحظة"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"المتطلب مستوفى في كل التقارير، فلا مخالفة؛ وغياب رقم الميزان فرصة للتحسين، وهي «ملاحظة» في قاعدة المقرر.","misconceptions":["لا إجراء متعطل ولا خطر بلا ضابط: كل التقارير موقعة في موعدها.","لا إخفاق في المتطلب نفسه، ولو مرة واحدة.","","يفوّت فرصة تحسين رآها المدقق، والتقرير يذكرها."],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d3-07","type":"single","prompt":"قال مدير في مقابلة تدقيق إن كل الفريق تدرب على الأداة الجديدة. ماذا يفعل المدقق؟","options":[{"key":"أ","text":"يسجّل القول دليلًا كافيًا في التقرير"},{"key":"ب","text":"يطلب سجلات التدريب ويعاين عينة منها"},{"key":"ج","text":"يكتب ملاحظة جسيمة في الحال"},{"key":"د","text":"يحيل السؤال إلى المدقق الخارجي ليتحقق"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"القول في المقابلة يُتحقق منه بدليل موضوعي، كسجلات التدريب.","misconceptions":["القول وحده لا يثبت؛ الدليل الموضوعي سجل يمكن معاينته.","","لا ملاحظة قبل دليل.","التحقق من عمل المدقق الداخلي نفسه."],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-08","type":"tf","prompt":"الملاحظة في تقرير التدقيق الداخلي تذكر المتطلب والدليل والدرجة.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"بهذه العناصر الثلاثة يستطيع القارئ أن يتحقق من الملاحظة ويعرف أولويتها.","misconceptions":["","ملاحظة بلا متطلب أو دليل أو درجة لا يمكن التحقق منها ولا ترتيبها."],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-09","type":"single","prompt":"في مصنع للأغذية، ["LO6"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-12","type":"single","prompt":"في تدقيق متابعة بمصنع الأغذية، 45 من 50 فحصًا للملصقات أُجري في موعده، ومقياس النجاح المكتوب 98%. ما قرار تدقيق المتابعة؟","options":[{"key":"أ","text":"يُغلق الإجراء"},{"key":"ب","text":"يُغلق إذا وافق مالكه"},{"key":"ج","text":"يُخفض المقياس ثم يُغلق"},{"key":"د","text":"يبقى مفتوحًا"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"45 من 50 تساوي 90%، وهي دون 98%، فالإجراء لم يبلغ مقياس نجاحه.","misconceptions":["يعدّ التحسن كافيًا وإن لم يبلغ المقياس.","يجعل المالك يغلق عمله، وموافقته لا تغيّر النتيجة.","يعدّل المقياس بعد النتيجة، فيُفرغ التحقق من معناه.",""],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"}]}</script>
